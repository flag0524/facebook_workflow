<!-- 이미지 게시물 카드를 1080x1350으로 그리는 템플릿. 3종 변형을 data-template으로 구분한다 -->
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden;
         font-family: "Pretendard", "Malgun Gothic", sans-serif; }
  .card { width: 100%; height: 100%; padding: 96px 88px;
          display: flex; flex-direction: column; justify-content: space-between; }
  .content { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 56px; }
  .card[data-template="1"] { background: #0B1220; color: #F8FAFC; }
  .card[data-template="2"] { background: #F8FAFC; color: #0B1220; }
  .card[data-template="3"] { background: linear-gradient(160deg, #1E3A8A, #0B1220); color: #F8FAFC; }
  h1 { font-size: 92px; line-height: 1.18; font-weight: 800; letter-spacing: -0.02em; }
  ul { display: flex; flex-direction: column; gap: 32px; list-style: none; }
  li { font-size: 46px; line-height: 1.45; opacity: 0.88; padding-left: 40px; position: relative; }
  li::before { content: ""; position: absolute; left: 0; top: 26px;
               width: 20px; height: 4px; background: currentColor; opacity: 0.6; }
  .mark { font-size: 32px; opacity: 0.5; letter-spacing: 0.04em; }
</style>
<div class="card" data-template="__TEMPLATE__">
  <div class="content">
    <h1>__HEADLINE__</h1>
    <ul>__BODY__</ul>
  </div>
  <div class="mark">AI 자동화 워크플로우</div>
</div>
