<!-- 이미지 게시물 카드를 1080x1350으로 그리는 템플릿. 3종 변형을 data-template으로 구분한다.
     __BG_IMAGE__에 data URI가 들어오면 AI 생성 이미지를 배경으로 깔고 스크림을 얹는다.
     비어 있으면 기존처럼 단색/그라데이션 배경으로 대체한다(no-image 클래스). -->
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden;
         font-family: "Pretendard", "Malgun Gothic", sans-serif; }
  .frame { position: relative; width: 1080px; height: 1350px; }
  .bg { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .scrim { position: absolute; inset: 0; }
  .frame[data-template="1"] .scrim { background: linear-gradient(180deg, rgba(11,18,32,0.30), rgba(11,18,32,0.90)); }
  .frame[data-template="1"] { color: #F8FAFC; }
  .frame[data-template="2"] .scrim { background: linear-gradient(180deg, rgba(248,250,252,0.30), rgba(248,250,252,0.92)); }
  .frame[data-template="2"] { color: #0B1220; }
  .frame[data-template="3"] .scrim { background: linear-gradient(160deg, rgba(30,58,138,0.40), rgba(11,18,32,0.92)); }
  .frame[data-template="3"] { color: #F8FAFC; }
  .frame.no-image .bg { display: none; }
  .frame.no-image .scrim { background: none; }
  .frame.no-image[data-template="1"] { background: #0B1220; }
  .frame.no-image[data-template="2"] { background: #F8FAFC; }
  .frame.no-image[data-template="3"] { background: linear-gradient(160deg, #1E3A8A, #0B1220); }
  .card { position: relative; width: 100%; height: 100%; padding: 96px 88px;
          display: flex; flex-direction: column; justify-content: space-between; }
  .content { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 56px; }
  h1 { font-size: 92px; line-height: 1.18; font-weight: 800; letter-spacing: -0.02em; }
  ul { display: flex; flex-direction: column; gap: 32px; list-style: none; }
  li { font-size: 46px; line-height: 1.45; opacity: 0.92; padding-left: 40px; position: relative; }
  li::before { content: ""; position: absolute; left: 0; top: 26px;
               width: 20px; height: 4px; background: currentColor; opacity: 0.6; }
  .mark { font-size: 32px; opacity: 0.55; letter-spacing: 0.04em; }
</style>
<div class="frame __NOIMAGE_CLASS__" data-template="__TEMPLATE__">
  <div class="bg" style="background-image: __BG_IMAGE__;"></div>
  <div class="scrim"></div>
  <div class="card">
    <div class="content">
      <h1>__HEADLINE__</h1>
      <ul>__BODY__</ul>
    </div>
    <div class="mark">AI 자동화 워크플로우</div>
  </div>
</div>
