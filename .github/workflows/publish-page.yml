name: Publish reviewed Facebook Page cycle

on:
  # 새 계획을 main에 push하면 검수 없이 바로 예약 등록한다
  push:
    branches: [main]
    paths: [content_plan.json]
  # 매일 06:00 KST(21:00 UTC): 콘텐츠 뱅크(plans/*.json)에서 예약 창(28일) 안에
  # 새로 들어온 건만 예약 등록한다. 이미 등록된 건은 state.json으로 건너뛴다
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      cycle:
        description: "Reviewed content cycle, for example 2026-10A or VIBE-2026-10"
        required: true
        type: string
      plan:
        description: "Plan file, for example content_plan.json or plans/vibe_coding.json"
        required: true
        default: content_plan.json
        type: string
      dry_run:
        description: "Render only. No Facebook API calls are made."
        required: true
        default: true
        type: boolean
      video_state:
        description: "Use SCHEDULED normally. Use DRAFT if scheduled Reels fail."
        required: true
        default: SCHEDULED
        type: choice
        options:
          - SCHEDULED
          - DRAFT

permissions:
  contents: write

concurrency:
  group: facebook-page-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium and video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m playwright install --with-deps chromium

      - name: Run preflight tests
        run: |
          python test_fb.py
          python test_plan.py
          python test_publish.py

      - name: Render or publish reviewed cycle
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          shopt -s nullglob
          case "${{ github.event_name }}" in
            workflow_dispatch) plans=("${{ inputs.plan }}") ;;
            push) plans=(content_plan.json) ;;
            *) plans=(content_plan.json plans/*.json) ;;
          esac
          status=0
          for plan in "${plans[@]}"; do
            if [ ! -f "$plan" ]; then
              echo "::error::계획 파일이 없다: $plan"
              status=1
              continue
            fi
            cycle=$(python -c "import json,sys; print(json.load(open(sys.argv[1], encoding='utf-8'))['cycle'])" "$plan")
            if [ -n "${{ inputs.cycle }}" ]; then
              cycle="${{ inputs.cycle }}"
            fi
            args=(--plan "$plan" --cycle "$cycle" --video-state "${{ inputs.video_state || 'SCHEDULED' }}")
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              args+=(--dry-run)
            fi
            echo "::group::$plan ($cycle)"
            python publish.py "${args[@]}" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Save completed publishing state
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.dry_run == false) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- state.json
          if git diff --cached --quiet; then
            echo "No state changes to save."
          else
            git commit -m "chore: save Facebook publishing state"
            git pull --rebase
            git push
          fi
