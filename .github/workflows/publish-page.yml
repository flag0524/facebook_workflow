name: Publish reviewed Facebook Page cycle

on:
  workflow_dispatch:
    inputs:
      cycle:
        description: "Reviewed content cycle, for example 2026-10A"
        required: true
        type: string
      dry_run:
        description: "Render only. No Facebook API calls are made."
        required: true
        default: true
        type: boolean
      video_state:
        description: "Use SCHEDULED normally. Use DRAFT if scheduled Reels fail."
        required: true
        default: SCHEDULED
        type: choice
        options:
          - SCHEDULED
          - DRAFT

permissions:
  contents: write

concurrency:
  group: facebook-page-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium and video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m playwright install --with-deps chromium

      - name: Run preflight tests
        run: |
          python test_fb.py
          python test_plan.py
          python test_publish.py

      - name: Render or publish reviewed cycle
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          args=(--cycle "${{ inputs.cycle }}" --video-state "${{ inputs.video_state }}")
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args+=(--dry-run)
          fi
          python publish.py "${args[@]}"

      - name: Save completed publishing state
        if: ${{ always() && inputs.dry_run == false }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- state.json
          if git diff --cached --quiet; then
            echo "No state changes to save."
          else
            git commit -m "chore: save Facebook publishing state"
            git push
          fi
